<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetWatch</title>
<style>
  :root{--bg:#0f1216;--panel:#171b21;--line:#262c35;--text:#e6e9ee;--mute:#8b94a3;--on:#2fbf71;--off:#e5484d;--acc:#4c8dff;--warn:#f0b429}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  h1{font-size:18px;margin:0;letter-spacing:.3px}
  .meta{color:var(--mute);font-size:12px}
  .btn{background:#222833;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
  .btn:hover{border-color:var(--acc)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 18px 0}
  .tab{white-space:nowrap;padding:8px 12px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mute);background:var(--panel)}
  .tab.active{color:var(--text);border-color:var(--acc);background:#1c2230}
  .tab small{display:block;font-size:11px;color:var(--mute)}
  main{padding:0 18px 30px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0}
  input[type=search]{background:#11151a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;min-width:220px;font:inherit}
  label.chk{color:var(--mute);display:flex;align-items:center;gap:6px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px;background:#141820}
  tr:last-child td{border-bottom:none}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--off)}
  .dot.on{background:var(--on);box-shadow:0 0 6px var(--on)}
  .name{background:transparent;border:1px solid transparent;color:var(--text);padding:5px 7px;border-radius:6px;width:100%;min-width:140px;font:inherit}
  .name:hover{border-color:var(--line)}.name:focus{border-color:var(--acc);outline:none;background:#11151a}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .mute{color:var(--mute)}
  .del{background:none;border:none;color:var(--mute);cursor:pointer;font-size:16px}.del:hover{color:var(--off)}
  .err{background:#3a1416;border:1px solid var(--off);color:#ffb3b5;padding:10px 12px;border-radius:8px;margin:12px 0}
  .events{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .events h3{margin:4px 0 8px;font-size:13px;color:var(--mute);text-transform:uppercase}
  .ev{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}.ev:last-child{border:none}
  .switch{position:relative;width:34px;height:18px;display:inline-block}
  .switch input{display:none}
  .switch span{position:absolute;inset:0;background:#333a46;border-radius:18px;cursor:pointer;transition:.15s}
  .switch span:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked+span{background:var(--acc)}.switch input:checked+span:before{transform:translateX(16px)}
  @media(max-width:760px){.hide-m{display:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>NetWatch</h1>
    <div class="meta" id="meta">lädt …</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="scanNow()">Jetzt scannen</button>
    <button class="btn" id="tgbtn" onclick="tgTest()">Telegram testen</button>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<main>
  <div id="error"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Suchen: Name, IP, MAC, Hersteller …" oninput="render()">
    <label class="chk"><input type="checkbox" id="onlyOff" onchange="render()"> nur offline</label>
    <label class="chk"><input type="checkbox" id="onlyUnnamed" onchange="render()"> nur unbenannt</label>
  </div>
  <table>
    <thead><tr>
      <th style="width:30px"></th><th>Name</th><th>IP</th><th class="hide-m">MAC</th>
      <th class="hide-m">Hostname</th><th class="hide-m">Hersteller</th><th class="hide-m">Verbindung</th><th>Zuletzt</th>
      <th title="Telegram bei online/offline">🔔</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="events"><h3>Ereignisse</h3><div id="events"></div></div>
</main>

<script>
let S = null, cur = localStorage.getItem("nw_tab") ?? "all", editing = false;

const fmt = ts => {
  if (!ts) return "–";
  const d = new Date(ts * 1000), s = (Date.now() - d) / 1000;
  if (s < 90) return "gerade eben";
  if (s < 3600) return Math.round(s / 60) + " min";
  if (s < 86400) return Math.round(s / 3600) + " h";
  return d.toLocaleDateString("de-DE") + " " + d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() {
  if (editing) return;
  try {
    const r = await fetch("api/state");
    S = await r.json();
    render();
  } catch (e) {
    document.getElementById("meta").textContent = "Keine Verbindung zum Server";
  }
}

function render() {
  if (!S) return;
  const all = S.devices, on = all.filter(d => d.online).length;
  document.getElementById("meta").textContent =
    `${on} / ${all.length} online · letzter Scan ${fmt(S.last_scan)} (${S.duration}s) · Intervall ${S.interval}s · Modus ${S.mode}${S.unifi ? " + UniFi" : ""}`;
  document.getElementById("error").innerHTML = (S.last_error ? `<div class="err">OPNsense-Fehler: ${esc(S.last_error)}</div>` : "")
    + (S.unifi_error ? `<div class="err">UniFi-Fehler: ${esc(S.unifi_error)}</div>` : "");
  document.getElementById("tgbtn").style.display = S.telegram ? "" : "none";

  const tabs = [{id:"all", label:"Alle", online:on, total:all.length, subnet:""}, ...S.vlans];
  if (!tabs.some(t => String(t.id) === String(cur))) cur = "all";
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<div class="tab ${String(t.id)===String(cur)?"active":""}" onclick="selTab('${t.id}')">${esc(t.label)}
       <small>${t.online}/${t.total} online${t.subnet ? " · " + t.subnet : ""}</small></div>`).join("");

  const q = document.getElementById("q").value.trim().toLowerCase();
  const onlyOff = document.getElementById("onlyOff").checked;
  const onlyUnnamed = document.getElementById("onlyUnnamed").checked;
  let list = all.filter(d => cur === "all" || String(d.vlan) === String(cur));
  if (q) list = list.filter(d => [d.name,d.unifi_name,d.ip,d.mac,d.vendor,d.hostname,d.conn].join(" ").toLowerCase().includes(q));
  if (onlyOff) list = list.filter(d => !d.online);
  if (onlyUnnamed) list = list.filter(d => !d.name);

  document.getElementById("rows").innerHTML = list.length ? list.map(d => `
    <tr>
      <td><span class="dot ${d.online?"on":""}" title="${d.online?"online":"offline"}"></span></td>
      <td><input class="name" value="${esc(d.name)}" placeholder="${esc((S.unifi_names && d.unifi_name) || d.hostname || "Name vergeben …")}"
           onfocus="editing=true" onblur="saveName(${d.id}, this)" onkeydown="if(event.key==='Enter')this.blur()"></td>
      <td class="mono">${esc(d.ip)}${cur==="all" && d.vlan ? ` <span class="mute">· ${d.vlan}</span>` : ""}</td>
      <td class="mono mute hide-m">${esc(d.mac)}</td>
      <td class="hide-m mute">${esc(d.hostname)}${d.unifi_name && d.unifi_name!==d.hostname ? `<br><small>UniFi: ${esc(d.unifi_name)}</small>` : ""}</td>
      <td class="hide-m mute">${esc(d.vendor)}</td>
      <td class="hide-m mute">${esc(d.conn)}</td>
      <td class="mute" title="${d.last_seen ? new Date(d.last_seen*1000).toLocaleString("de-DE") : ""}">${d.online ? "jetzt" : fmt(d.last_seen)}</td>
      <td><label class="switch"><input type="checkbox" ${d.watch?"checked":""} onchange="setWatch(${d.id}, this.checked)"><span></span></label></td>
      <td><button class="del" title="Gerät entfernen" onclick="delDev(${d.id})">✕</button></td>
    </tr>`).join("") : `<tr><td colspan="10" class="mute" style="text-align:center;padding:24px">Keine Geräte</td></tr>`;

  document.getElementById("events").innerHTML = S.events.length ? S.events.map(e =>
    `<div class="ev"><span class="mute">${new Date(e.ts*1000).toLocaleString("de-DE")}</span> – ${esc(e.text)}</div>`).join("")
    : `<div class="mute">Noch keine Ereignisse</div>`;
}

function selTab(id) { cur = id; localStorage.setItem("nw_tab", id); render(); }

async function post(url, body, method="POST") {
  return fetch(url, {method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
}
async function saveName(id, el) {
  editing = false;
  const d = S.devices.find(x => x.id === id);
  if (d && d.name !== el.value.trim()) { d.name = el.value.trim(); await post("api/devices/" + id, {name: d.name}); }
  load();
}
async function setWatch(id, v) { await post("api/devices/" + id, {watch: v}); load(); }
async function delDev(id) {
  if (!confirm("Gerät aus der Liste entfernen? (Taucht beim nächsten Scan wieder als neu auf, falls aktiv)")) return;
  await post("api/devices/" + id, null, "DELETE"); load();
}
async function scanNow() { await post("api/scan"); setTimeout(load, 3000); }
async function tgTest() {
  const r = await post("api/telegram/test");
  alert(r.ok ? "Testnachricht gesendet." : "Senden fehlgeschlagen – Token / Chat-ID prüfen.");
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
